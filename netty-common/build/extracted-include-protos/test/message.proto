syntax = "proto3";

package com.example.netty.common.proto;

option java_multiple_files = true;
option java_package = "com.example.netty.common.proto";
option java_outer_classname = "MessageProto";

enum MessageType {
  UNKNOWN = 0;
  PING = 1;
  PONG = 2;
  REQUEST = 3;
  RESPONSE = 4;
  UPGRADE = 5;
}

message Ping {
  int64 timestamp = 1;
}

message Pong {
  int64 timestamp = 1;
}

message Request {
  string reqId = 1;
  string command = 2;
  string data = 3;
}

message Response {
  string reqId = 1;
  int32 code = 2;
  string message = 3;
  string data = 4;
}

message UpgradeCommand {
  string version = 1;
  string downloadUrl = 2;
  bool force = 3;
}

message MessagePacket {
  MessageType type = 1;
  int64 sequence = 2;
  oneof payload {
    Ping ping = 3;
    Pong pong = 4;
    Request request = 5;
    Response response = 6;
    UpgradeCommand upgradeCommand = 7;
  }
}
