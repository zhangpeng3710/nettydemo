plugins {
    id 'java'
}

configurations {
    ossUpload
}

dependencies {
    implementation project(':netty-client')
    
    // Aliyun OSS dependencies included in compileOnly for compilation of OSSUploader
    compileOnly 'com.aliyun.oss:aliyun-sdk-oss:3.17.4'
    compileOnly 'javax.xml.bind:jaxb-api:2.3.1'
    compileOnly 'org.glassfish.jaxb:jaxb-runtime:2.3.3'
    
    ossUpload 'com.aliyun.oss:aliyun-sdk-oss:3.17.4'
    ossUpload 'javax.xml.bind:jaxb-api:2.3.1'
    ossUpload 'org.glassfish.jaxb:jaxb-runtime:2.3.3'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.example.netty.upgrade.UpgradeAgent'
        )
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "META-INF/SIG-*"
    }
    exclude "**/OSSUploader.class"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task uploadToOSS(type: JavaExec) {
    dependsOn ':netty-client:packageClientForGetdown'
    group = 'upload'
    description = 'Uploads the generated getdown upgrade files to Aliyun OSS.'
    
    mainClass = 'com.example.netty.upgrade.OSSUploader'
    // Ensure both compiled outputs and ossUpload configurations are in classpath
    classpath = sourceSets.main.output + configurations.ossUpload
    
    // Load credentials from local.properties if present
    def localProps = new Properties()
    def localPropsFile = project.rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    
    def ak = System.getenv("OSS_ACCESS_KEY_ID") ?: localProps.getProperty("oss.accessKeyId") ?: ""
    def sk = System.getenv("OSS_ACCESS_KEY_SECRET") ?: localProps.getProperty("oss.accessKeySecret") ?: ""
    
    systemProperty 'oss.accessKeyId', ak
    systemProperty 'oss.accessKeySecret', sk
    
    // Point to netty-client build/upgrade-dir
    args = [ file("${project(':netty-client').buildDir}/upgrade-dir").absolutePath ]
}

build.dependsOn uploadToOSS
