plugins {
    id 'java'
}

dependencies {
    implementation 'com.threerings.getdown:getdown-launcher:1.8.6'
    implementation 'com.threerings.getdown:getdown-core:1.8.6'
    implementation project(':netty-client')
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.example.netty.upgrade.CustomLauncher'
        )
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "META-INF/SIG-*"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Define packaging task
task packageClientForGetdown {
    dependsOn ':netty-client:bootJar'

    doLast {
        def upgradeDir = file("${project.buildDir}/upgrade-dir")
        if (upgradeDir.exists()) {
            upgradeDir.deleteDir()
        }
        upgradeDir.mkdirs()

        // 1. Copy Netty Client Boot JAR
        def clientJar = file("${project.project(':netty-client').buildDir}/libs/netty-client-1.0.0.jar")
        if (!clientJar.exists()) {
            // Find any jar in the build/libs directory
            def libsDir = file("${project.project(':netty-client').buildDir}/libs")
            if (libsDir.exists()) {
                def files = libsDir.listFiles()
                if (files != null && files.length > 0) {
                    clientJar = files[0]
                }
            }
        }
        
        if (!clientJar.exists()) {
            throw new GradleException("Could not find compiled netty-client JAR")
        }

        def targetJar = new File(upgradeDir, "netty-client.jar")
        targetJar.bytes = clientJar.bytes
        println "Copied client JAR to: ${targetJar.absolutePath}"

        // 2. Generate getdown.txt
        def getdownFile = new File(upgradeDir, "getdown.txt")
        getdownFile.text = """appbase = http://localhost:8080/upgrade
class = org.springframework.boot.loader.JarLauncher
code = netty-client.jar
jvmarg = -Dfile.encoding=UTF-8
"""
        println "Generated getdown.txt"

        // 3. Run Getdown's Digester tool to generate digest.txt and digest2.txt
        javaexec {
            mainClass = 'com.threerings.getdown.tools.Digester'
            classpath = configurations.runtimeClasspath
            args = [ upgradeDir.absolutePath ]
        }
        println "Generated digests using Getdown Digester tool."
    }
}

build.dependsOn packageClientForGetdown



